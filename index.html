  <body>
    <!-- 首屏之前定好主题，避免浅色系统上先闪一帧夜场。解析逻辑见 src/hooks/useTheme.ts -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('bm.theme') || '"system"');
          if (t !== 'night' && t !== 'day') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'night');
        }
      })();
    </script>
    <div id="root"></div>
  </body>
